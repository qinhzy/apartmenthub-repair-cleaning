<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#072a4d">
    <meta name="description" content="ApartmentHub 公寓维修与保洁运维工作台">
    <title>ApartmentHub 公寓运维</title>
    <link rel="stylesheet" href="/app.css">
    <script src="/app.js" defer></script>
</head>
<body>
<div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="主导航">
        <a class="brand" href="#overview" aria-label="ApartmentHub 运维总览">
            <span class="brand-mark" aria-hidden="true">A</span>
            <span><strong>ApartmentHub</strong><small>公寓运维</small></span>
        </a>
        <nav class="side-nav">
            <a class="is-active" href="#overview" data-nav="overview">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5M5.5 10v10h13V10M9.5 20v-6h5v6"/></svg>
                运维总览
            </a>
            <a href="#repairs" data-nav="repairs">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 4h8M9 2h6v4H9zM6 5h12a2 2 0 0 1 2 2v14H4V7a2 2 0 0 1 2-2Zm2 6h8m-8 4h8"/></svg>
                维修工单
            </a>
            <a href="#cleaning" data-nav="cleaning">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 3v4m10-4v4M4 9h16M5 5h14a1 1 0 0 1 1 1v15H4V6a1 1 0 0 1 1-1Zm3 8h3v3H8z"/></svg>
                保洁计划
            </a>
        </nav>
        <div class="system-state" id="system-state" data-state="loading" role="status" aria-live="polite">
            <span class="status-dot"></span>
            <span id="system-state-label">系统状态：正在连接</span>
        </div>
    </aside>

    <div class="sidebar-scrim" id="sidebar-scrim" hidden></div>

    <main class="main-content" id="overview">
        <header class="topbar">
            <button class="icon-button mobile-only" id="menu-button" type="button" aria-label="打开导航" aria-expanded="false" aria-controls="sidebar">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
            </button>
            <div>
                <h1>今日运维</h1>
                <p id="today-label">正在读取日期…</p>
            </div>
            <div class="topbar-actions">
                <button class="button button-quiet" id="refresh-button" type="button">
                    <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 6v5h-5M4 18v-5h5M6.2 9A7 7 0 0 1 18 6l2 5M18 15a7 7 0 0 1-12 3l-2-5"/></svg>
                    <span>刷新</span>
                </button>
                <button class="button button-primary" id="new-repair-button" type="button">
                    <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                    新建维修工单
                </button>
            </div>
        </header>

        <section class="metrics" aria-label="今日运维摘要" aria-busy="true">
            <article class="metric metric-pending">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 3h10v3H7zM5 5h14v16H5zM8 11h8m-8 4h5"/></svg>
                <div><span>待处理维修</span><strong id="metric-pending">—</strong></div>
            </article>
            <article class="metric metric-processing">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m14 6 4-4 4 4-4 4M18 2v11a6 6 0 0 1-6 6H4"/></svg>
                <div><span>处理中</span><strong id="metric-processing">—</strong></div>
            </article>
            <article class="metric metric-check">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 4h8l1 3h3v14H4V7h3l1-3Zm1 10 2 2 4-5"/></svg>
                <div><span>待验收</span><strong id="metric-check">—</strong></div>
            </article>
            <article class="metric metric-cleaning">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 3 2 1-5 9-3-2 6-8ZM8 12l5 3-3 6H3l5-9Zm6 5h6m-5 4h6"/></svg>
                <div><span>今日保洁</span><strong id="metric-cleaning">—</strong></div>
            </article>
        </section>

        <div class="mobile-tabs" role="tablist" aria-label="运维模块">
            <button class="is-active" id="repairs-tab" type="button" role="tab" data-tab="repairs" aria-selected="true" aria-controls="repairs" tabindex="0">维修工单</button>
            <button id="cleaning-tab" type="button" role="tab" data-tab="cleaning" aria-selected="false" aria-controls="cleaning" tabindex="-1">保洁计划</button>
        </div>

        <div class="workspace-grid">
            <section class="work-panel repair-panel" id="repairs" role="tabpanel" aria-labelledby="repairs-tab repair-title" aria-busy="false">
                <div class="panel-heading">
                    <div>
                        <h2 id="repair-title">维修工单</h2>
                        <p><span id="repair-total">—</span> 条工单<span id="urgent-summary"></span></p>
                    </div>
                </div>

                <form class="filters" id="repair-filters" role="search">
                    <label>
                        <span class="sr-only">按状态筛选</span>
                        <select id="status-filter" name="status">
                            <option value="">全部状态</option>
                            <option value="PENDING">待处理</option>
                            <option value="PROCESSING">处理中</option>
                            <option value="WAITING_CHECK">待验收</option>
                            <option value="COMPLETED">已完成</option>
                        </select>
                    </label>
                    <label>
                        <span class="sr-only">按类型筛选</span>
                        <select id="type-filter" name="type">
                            <option value="">全部类型</option>
                            <option value="PLUMBING">水电维修</option>
                            <option value="FURNITURE">家具维修</option>
                            <option value="APPLIANCE">电器维修</option>
                            <option value="NETWORK">网络维修</option>
                            <option value="OTHER">其他</option>
                        </select>
                    </label>
                    <label class="search-field">
                        <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg>
                        <span class="sr-only">搜索工单</span>
                        <input id="query-filter" name="query" type="search" maxlength="100" placeholder="搜索工单" autocomplete="off">
                    </label>
                </form>
                <div class="sync-note" id="repair-sync-note" role="status" hidden>
                    数据同步失败，正在显示上次成功结果。
                </div>

                <div class="table-wrap">
                    <table>
                        <thead>
                        <tr>
                            <th scope="col">标题</th>
                            <th scope="col">优先级</th>
                            <th scope="col">类型</th>
                            <th scope="col">状态</th>
                            <th scope="col">指派给</th>
                            <th scope="col">创建时间</th>
                            <th scope="col" class="action-column">操作</th>
                        </tr>
                        </thead>
                        <tbody id="repair-table-body"></tbody>
                    </table>
                </div>
                <div class="mobile-repair-list" id="repair-mobile-list"></div>
                <div class="empty-state" id="repair-empty" hidden>
                    <strong>没有匹配的维修工单</strong>
                    <p>调整筛选条件，或新建一条维修工单。</p>
                </div>

                <footer class="pagination" aria-label="维修工单分页">
                    <span id="page-summary">正在加载…</span>
                    <div>
                        <button class="icon-button" id="previous-page" type="button" aria-label="上一页">‹</button>
                        <strong id="current-page">1</strong>
                        <button class="icon-button" id="next-page" type="button" aria-label="下一页">›</button>
                    </div>
                </footer>
            </section>

            <section class="work-panel cleaning-panel" id="cleaning" role="tabpanel" aria-labelledby="cleaning-tab cleaning-title">
                <div class="panel-heading cleaning-heading">
                    <div>
                        <h2 id="cleaning-title">今日保洁计划</h2>
                        <p id="cleaning-date">—</p>
                    </div>
                    <button class="button button-small" id="new-cleaning-button" type="button">新增计划</button>
                </div>
                <ol class="cleaning-list" id="cleaning-list"></ol>
                <div class="empty-state" id="cleaning-empty" hidden>
                    <strong>今天还没有保洁计划</strong>
                    <p>新增计划后会在这里按时间排列。</p>
                </div>
            </section>
        </div>
    </main>
</div>

<dialog class="action-dialog" id="action-dialog" aria-labelledby="dialog-title">
    <form method="dialog" id="action-form">
        <header>
            <div>
                <h2 id="dialog-title"></h2>
                <p id="dialog-subtitle"></p>
            </div>
            <button class="icon-button" value="cancel" type="button" id="dialog-close" aria-label="关闭">×</button>
        </header>
        <div class="dialog-fields" id="dialog-fields"></div>
        <footer>
            <button class="button button-secondary" value="cancel" type="button" id="dialog-cancel">取消</button>
            <button class="button button-primary" type="submit" id="dialog-submit">确认</button>
        </footer>
    </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span class="toast-icon" aria-hidden="true">✓</span>
    <span id="toast-message">操作成功</span>
    <button type="button" id="toast-close" aria-label="关闭通知">×</button>
</div>

<template id="loading-row-template">
    <tr class="loading-row"><td colspan="7"><span></span></td></tr>
</template>
</body>
</html>
